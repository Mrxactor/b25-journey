<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B25 GROUP — Vår resa</title>
<meta name="description" content="B25 GROUP — vår resa från Biskopsgården, för Biskopsgården.">
<style>
:root {
  --bg:#07090d;
  --panel:#0e1218;
  --text:#f4f5f7;
  --muted:#aab2bd;
  --line:#2b3440;
  --blue:#5fa6c4;
  --deep:#061a37;
  --teal:#15647b;
  --soft:#d8dde3;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-snap-type:y proximity}
body{
  margin:0;background:
  radial-gradient(circle at 20% 0%, rgba(95,166,196,.13), transparent 30rem),
  linear-gradient(#07090d,#0a0d12 45%,#07090d);
  color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  overflow-x:hidden;
}
a{color:inherit}
#progress{position:fixed;z-index:99;left:0;top:0;height:3px;width:0;background:linear-gradient(90deg,#fff,var(--blue));}
.topbar{
  position:fixed;z-index:90;top:18px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:rgba(8,10,14,.70);border:1px solid rgba(255,255,255,.1);
  border-radius:999px;backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(0,0,0,.3)
}
.topbar img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.topbar span{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.topbar button{appearance:none;border:0;background:#fff;color:#111;border-radius:999px;padding:8px 11px;font-weight:800;cursor:pointer}
section{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:110px clamp(22px,5vw,78px) 74px;position:relative;scroll-snap-align:start
}
.container{width:min(1180px,100%);margin:auto;position:relative;z-index:2}
.eyebrow{font-size:.75rem;letter-spacing:.28em;text-transform:uppercase;color:#b9c2cc;font-weight:800;margin-bottom:18px}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(3.5rem,10vw,8.8rem);line-height:.85;letter-spacing:-.065em;margin-bottom:26px}
h2{font-size:clamp(2.5rem,7vw,6.3rem);line-height:.92;letter-spacing:-.055em;margin-bottom:24px}
h3{font-size:clamp(1.45rem,3vw,2.2rem);line-height:1.05}
.lead{font-size:clamp(1.15rem,2.4vw,1.72rem);line-height:1.5;max-width:850px;color:#d8dde3}
.copy{font-size:clamp(1rem,1.5vw,1.18rem);line-height:1.7;color:#c4ccd5;max-width:760px}
.hero{overflow:hidden}
.hero:after{
  content:"";position:absolute;inset:auto -20vw -25vh auto;width:70vw;height:70vw;
  border:1px solid rgba(255,255,255,.08);border-radius:50%;
}
.symbol{width:min(210px,34vw);aspect-ratio:1;border-radius:50%;object-fit:cover;
  box-shadow:0 0 0 1px rgba(255,255,255,.13),0 30px 90px rgba(0,0,0,.55);margin-bottom:30px}
.hero-title small{display:block;font-size:clamp(1rem,2vw,1.35rem);letter-spacing:.34em;text-transform:uppercase;color:#c9d0d8;margin-bottom:18px}
.hero-title strong{display:block}
.tagline{font-family:Georgia,serif;font-style:italic;font-size:clamp(1.2rem,2.4vw,1.8rem);color:#cdd4db}
.scrollhint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:.72rem;letter-spacing:.18em;color:#8d98a5;text-transform:uppercase}
.road-wrap{position:relative}
.road{position:absolute;left:50%;top:0;bottom:0;width:2px;background:linear-gradient(transparent,#4d5c6d 5%,#4d5c6d 95%,transparent);opacity:.7}
.stop{position:relative;display:grid;grid-template-columns:1fr 92px 1fr;gap:25px;align-items:center;margin:70px 0}
.dot{grid-column:2;width:20px;height:20px;border-radius:50%;background:#fff;justify-self:center;box-shadow:0 0 0 9px rgba(255,255,255,.08),0 0 30px rgba(95,166,196,.5)}
.stop:nth-child(odd) .card{grid-column:1;grid-row:1}
.stop:nth-child(even) .card{grid-column:3;grid-row:1}
.card{padding:30px;border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.11);box-shadow:0 25px 80px rgba(0,0,0,.25)}
.card p{color:#bac3cc;line-height:1.65;margin-bottom:0}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:34px}
.person{padding:22px;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:rgba(255,255,255,.035)}
.person b{display:block;font-size:1.03rem;margin-bottom:5px}
.person span{font-size:.88rem;color:#9ea8b4}
.branch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:40px}
.branch{position:relative;overflow:hidden;border-radius:28px;min-height:460px;padding:28px;border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;justify-content:flex-end;background:#111}
.branch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.38}
.branch:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 25%,rgba(0,0,0,.88))}
.branch > *:not(img){position:relative;z-index:2}
.branch h3{margin-bottom:10px}
.branch p{margin:0;color:#d7dbe0;line-height:1.5}
.split{display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center}
.poster{width:100%;max-height:72vh;object-fit:contain;border-radius:28px;box-shadow:0 30px 90px rgba(0,0,0,.35)}
.timeline{margin-top:36px;display:grid;gap:0}
.trow{display:grid;grid-template-columns:110px 1fr;gap:22px;padding:19px 0;border-top:1px solid rgba(255,255,255,.09)}
.trow time{font-weight:900;color:#fff}
.trow p{margin:0;color:#b9c2cc}
.bridge{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;margin:36px 0}
.node{padding:22px;text-align:center;border-radius:20px;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.04);font-weight:900;letter-spacing:.05em}
.center-node{padding:24px;border-radius:50%;width:150px;height:150px;display:grid;place-items:center;text-align:center;background:#fff;color:#07101a;font-weight:950;box-shadow:0 0 50px rgba(95,166,196,.18)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:35px}
.metric{padding:28px;border-radius:24px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1)}
.metric strong{display:block;font-size:clamp(2.2rem,5vw,4.6rem);line-height:1;letter-spacing:-.05em}
.metric span{display:block;color:#aeb7c0;margin-top:9px}
.gold{background:radial-gradient(circle at 50% 45%,rgba(218,184,90,.16),transparent 34rem),#07090d;text-align:center}
.gold .big{font-size:clamp(5rem,18vw,14rem);line-height:.72;letter-spacing:-.08em;font-weight:1000;margin:25px 0}
.quote{font-family:Georgia,serif;font-style:italic;font-size:clamp(1.5rem,3.4vw,3rem);line-height:1.3;max-width:920px;margin:30px auto;color:#eef1f4}
.bibbi{background:linear-gradient(135deg,#0b2430,#0f5265)}
.final{text-align:center}
.final .symbol{margin-left:auto;margin-right:auto}
.final-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:38px auto;max-width:980px}
.final-grid div{padding:24px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035)}
.reveal{opacity:0;transform:translateY(32px);transition:.75s ease}
.rev
